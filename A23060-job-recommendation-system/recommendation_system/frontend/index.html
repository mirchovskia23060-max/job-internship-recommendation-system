<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Систем за препорака на пракси и вработувања</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Препорачани позиции за студенти</h1>
      <p class="subtitle">Персонализирани прилики за пракса и вработување</p>
    </header>

    <section class="controls">
      <div class="control-group">
        <label for="candidateSelect">Кандидат:</label>
        <select id="candidateSelect"></select>
      </div>

      <div class="control-group">
        <label for="categoryFilter">Категорија:</label>
        <select id="categoryFilter">
          <option value="">Сите категории</option>
          <option value="Software Development">Software Development</option>
          <option value="Data Analytics">Data Analytics</option>
          <option value="Marketing">Marketing</option>
          <option value="Business">Business</option>
          <option value="Design">Design</option>
          <option value="Finance">Finance</option>
        </select>
      </div>

      <div class="control-group">
        <label for="typeFilter">Тип на ангажман:</label>
        <select id="typeFilter">
          <option value="">Сите типови</option>
          <option value="Internship">Internship</option>
          <option value="Full-time">Full-time</option>
          <option value="Part-time">Part-time</option>
        </select>
      </div>

      <div class="control-group checkbox-group">
        <label>
          <input type="checkbox" id="remoteFilter"> Само Remote позиции
        </label>
      </div>

      <button id="applyFiltersBtn">Примени филтри</button>
    </section>

    <main>
      <div id="statusMessage" class="status-msg"></div>
      <div id="cardsContainer" class="cards-grid"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
